# Configurazione deploy Netlify.

[build]
  command = "npm run build"   # include `astro check`: un errore di tipo blocca la pubblicazione
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Il sito è in produzione su lumefitness.it: niente X-Robots-Tag noindex.
# (Il blocco staging che lo impostava è stato rimosso al go-live: tenerlo
# avrebbe detto a Google di non indicizzare nulla, lasciando in indice
# solo le vecchie pagine WordPress.)

# Asset con hash nel nome: immutabili, cache lunga.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sicurezza di base. La CSP non c'è di proposito: con GTM e Iubenda inline va
# scritta con cura e verificata, meglio farlo in un passaggio dedicato.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ─────────────────────────────────────────────────────────────────────────
# REDIRECT DEI VECCHI FORM
#
# Il sito WordPress mandava la raccolta lead fuori dal sito: due form nativi
# n8n, tre Typeform e uno shortlink interno. Quegli URL sono in giro da anni —
# nelle campagne Google Ads, nei QR in sede, nei post social, nelle email — e
# continueranno a essere cliccati per molto tempo dopo il go-live.
#
# `force = true` perché servono anche quando esiste un file con lo stesso nome,
# e lo status è 301: sono spostamenti definitivi, così i click si consolidano
# sulle pagine nuove invece di restare in un limbo.
#
# La query string viene mantenuta da Netlify: `?source=X&medium=Y` sopravvive al
# redirect e viene letto dal tracciamento. È esattamente ciò che il vecchio
# /provagratis rompeva, buttando via l'attribuzione di otto CTA su cinque pagine.
# ─────────────────────────────────────────────────────────────────────────

# Il vecchio sito aveva /planning, /planning-macerata e /planning-montecassiano.
# Sono URL che la gente ha nei preferiti e che lo staff manda su WhatsApp.
[[redirects]]
  from = "/planning"
  to = "/planning/macerata"
  status = 301
  force = true

[[redirects]]
  from = "/planning-macerata"
  to = "/planning/macerata"
  status = 301
  force = true

[[redirects]]
  from = "/planning-montecassiano"
  to = "/planning/montecassiano"
  status = 301
  force = true

[[redirects]]
  from = "/provagratis"
  to = "/prova"
  status = 301
  force = true

[[redirects]]
  from = "/form/guest-pass"
  to = "/prova"
  status = 301
  force = true

[[redirects]]
  from = "/form/iscrizioni"
  to = "/iscriviti"
  status = 301
  force = true

# I due Typeform per sede confluiscono nel form info con il centro già scelto.
[[redirects]]
  from = "/infoMacerata"
  to = "/contatti?centro=macerata"
  status = 301
  force = true

[[redirects]]
  from = "/infoMonte"
  to = "/contatti?centro=montecassiano"
  status = 301
  force = true

# ─────────────────────────────────────────────────────────────────────────
# REDIRECT SEO — VECCHIE PAGINE WORDPRESS
#
# Il WordPress aveva una decina di pagine editoriali indicizzate da Google
# (/macerata/, /corsi-fitness/, …). Dopo il cambio sito risponderebbero 404:
# ogni 301 qui sotto porta utenti e ranking sulla pagina nuova equivalente
# e fa sparire il vecchio URL dall'indice in qualche settimana.
#
# Ogni percorso è dichiarato con e senza slash finale: il matching dei
# redirect Netlify non normalizza le due forme, e Google le ha indicizzate
# entrambe nel tempo.
# ─────────────────────────────────────────────────────────────────────────

# Le due sedi (più le varianti "home-" usate dal vecchio menu).
[[redirects]]
  from = "/macerata"
  to = "/centri/macerata"
  status = 301
  force = true
[[redirects]]
  from = "/macerata/"
  to = "/centri/macerata"
  status = 301
  force = true
[[redirects]]
  from = "/home-macerata"
  to = "/centri/macerata"
  status = 301
  force = true
[[redirects]]
  from = "/home-macerata/"
  to = "/centri/macerata"
  status = 301
  force = true
[[redirects]]
  from = "/montecassiano"
  to = "/centri/montecassiano"
  status = 301
  force = true
[[redirects]]
  from = "/montecassiano/"
  to = "/centri/montecassiano"
  status = 301
  force = true
[[redirects]]
  from = "/home-montecassiano"
  to = "/centri/montecassiano"
  status = 301
  force = true
[[redirects]]
  from = "/home-montecassiano/"
  to = "/centri/montecassiano"
  status = 301
  force = true


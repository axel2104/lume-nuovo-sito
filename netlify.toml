# Configurazione deploy Netlify.

[build]
  command = "npm run build"   # include `astro check`: un errore di tipo blocca la pubblicazione
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────
# STAGING — DA RIMUOVERE AL GO-LIVE
# Finché il sito vive sull'URL *.netlify.app e www.lumefitness.it è ancora il
# WordPress, questo blocco tiene il nuovo sito fuori dagli indici: due versioni
# degli stessi contenuti indicizzate insieme si cannibalizzano a vicenda.
# Quando si passa in produzione: cancellare questo blocco headers.
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Asset con hash nel nome: immutabili, cache lunga.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sicurezza di base. La CSP non c'è di proposito: con GTM e Iubenda inline va
# scritta con cura e verificata, meglio farlo in un passaggio dedicato.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
